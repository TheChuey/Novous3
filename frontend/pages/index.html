<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novous Squads</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="/static/css/test_panel.css">
  <link rel="stylesheet" href="/static/css/codebuilder.css">
  <link rel="stylesheet" href="/static/css/squads.css">
</head>
<body class="bg-dark text-light">
  <div id="app" class="app-container">
    <header class="navbar">
      <div class="logo">
        <span class="logo-icon">⚡</span>
        <h1 class="logo-text" data-about-managed="true" style="font-size: inherit; font-weight: inherit; line-height: inherit; margin: 0;">Novous <strong>Squads</strong></h1>
      </div>
      <nav class="app-tabs" aria-label="Sections">
        <div class="app-tab-group" role="group" aria-label="Build">
          <button class="nav-btn active" data-tab="squads">Squads</button>
          <button class="nav-btn" data-tab="agents">Agents</button>
          <button class="nav-btn" data-tab="tools">Tools</button>
          <button class="nav-btn" data-tab="models">Models</button>
          <button class="nav-btn" data-tab="runs">Runs</button>
        </div>
        <span class="app-tab-divider" aria-hidden="true"></span>
        <div class="app-tab-group" role="group" aria-label="Workspace">
          <button class="nav-btn" data-tab="dashboard">Overview</button>
          <button class="nav-btn" data-tab="editor">Editor</button>
          <button class="nav-btn" data-tab="codebuilder">Code Builder</button>
          <button class="nav-btn" data-tab="chat">Chat Console</button>
          <button class="nav-btn" data-tab="prompt-creation">Chat Agent</button>
        </div>
      </nav>
      <div id="health-badge" class="badge badge-success">System Ready</div>
    </header>

    <!-- Dynamic Content View Frame -->
    <main id="view-container" class="main-content">
      <div class="loading-spinner">Loading Novous Squads...</div>
    </main>
  </div>

  <script src="https://unpkg.com/lucide@latest" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.min.js"></script>
  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
